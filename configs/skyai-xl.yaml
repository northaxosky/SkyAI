# skyai-xl (~1.5B) — the scale-up of skyai. Only dimensions, data, and budget change.
# Data is expected to be tokenized from ClimbMix with scripts/shard_text.py.
#
# PARKED: staged, not run. skyai.yaml was retargeted to the gpt2-scale three-way
# comparison (gpt2 BPE, FineWeb-Edu, gpt2-muon's schedule shape), so this file re-pins
# the wider tokenizer and the untethered modern schedule it was actually designed for.
extends: skyai.yaml

model:
  n_layer: 48
  n_head: 32
  n_kv_head: 8
  n_embd: 1536
  block_size: 2048
  vocab_size: 100352        # cl100k_base n_vocab=100277 padded to 128
  tokenizer: cl100k_base

data:
  root: data/climbmix_cl100k
  batch_size: 16

schedule:
  max_steps: 57220
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05

eval:
  interval: 1000
  evals: [hellaswag, lambada]
  sample_prompt: "Hello, I'm a language model,"
  sample_n: 4
  sample_max_length: 64

log:
  dir: logs/skyai-xl

checkpoint:
  dir: checkpoints/skyai-xl
  best_metric: val_loss
  best_direction: min
