# skyai (modern arch at gpt2 scale) — the modernization of gpt2. This file IS the diff:
# RMSNorm / RoPE / SwiGLU / GQA, Muon + warmup-stable-decay — at gpt2's depth, width,
# tokenizer, and token budget. Third leg of the ladder:
#   gpt2 (AdamW + cosine) -> gpt2-muon (recipe change) -> skyai (architecture change).
extends: gpt2.yaml

grad_clip: null  # modern recipe does not clip gradients

model:
  family: modern
  n_kv_head: 3              # 12 query heads -> 4:1 GQA
  hidden_multiple: 4
  vocab_size: 50257         # logical gpt2 vocab; padded to 50304 internally by vocab_pad_multiple
  vocab_pad_multiple: 128
  rope_theta: 100000.0
  tokenizer: gpt2
  tie_weights: false
  logit_softcap: 15.0
  init_policy: sky-ai

data:
  root: data/edu_fineweb10B
  batch_size: 32  # 32 * 1024 * 4 ranks * 4 accum = 524288; ~33GB/GPU vs ~65GB at bs=64

optim:
  type: muon-split
  weight_decay: 0.28
  # Canonical modern-stack LRs; these diverge on faithful gpt2 (tied wte + LayerNorm),
  # so the gap vs gpt2-muon is architecture-caused, not a free hyperparameter.
  embedding_lr: 0.3
  unembedding_lr: 0.008     # live here: lm_head is untied, unlike gpt2
  matrix_lr: 0.02
  muon_momentum: 0.95
  muon_beta2: 0.9
  muon_ns_steps: 5

schedule:
  type: warmup-stable-decay
  max_lr: 1.0
  min_lr: 0.0
  # warmup_steps (715) and max_steps (19073) inherit from gpt2.yaml: schedule shape is
  # held identical to gpt2-muon so the comparison isolates architecture.
  warmdown_ratio: 0.4
  final_lr_frac: 0.0

log:
  dir: logs/skyai

checkpoint:
  dir: checkpoints/skyai
